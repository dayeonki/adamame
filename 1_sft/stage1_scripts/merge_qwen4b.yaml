### Note: DO NOT use quantized model or quantization_bit when merging lora adapters

### Run command
# llamafactory-cli export scripts_sft/merge/merge_distill.yaml

### model
model_name_or_path: Qwen/Qwen3-4B
adapter_name_or_path: saves/qwen_4b/adapter
